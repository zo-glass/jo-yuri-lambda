AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: An AWS Serverless Application Model (SAM) template describing your function.
Resources:
  joyurinews:
    Type: AWS::Serverless::Function
    Properties:
      Architectures:
        - arm64
      CodeUri: ./src
      Description: ''
      EphemeralStorage:
        Size: 512
      Handler: lambda_function.lambda_handler
      Layers:
        - arn:aws:lambda:us-east-1:000000000000:layer:Python-requests-bs4:5
        - >-
          arn:aws:lambda:us-east-1:000000000000:layer:Python-googlenewsdecoder:11
        - arn:aws:lambda:us-east-1:000000000000:layer:zo-glass:4
      LoggingConfig:
        LogFormat: Text
        LogGroup: /aws/lambda/jo-yuri-news
      MemorySize: 128
      PackageType: Zip
      RecursiveLoop: Terminate
      Runtime: python3.14
      RuntimeManagementConfig:
        UpdateRuntimeOn: Auto
      SnapStart:
        ApplyOn: None
      Tags: {}
      Timeout: 900
      Tracing: PassThrough
      Events:
        Trigger1Event:
          Type: Schedule
          Properties:
            Schedule: cron(0 1 * * ? *)
